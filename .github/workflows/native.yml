name: 네이티브 빌드 검증
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.16.0"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/mobile exec expo prebuild --platform android --no-install
      - run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 3
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.16.0"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/mobile exec expo prebuild --platform ios --no-install
      - run: pod install
        working-directory: apps/mobile/ios
      - run: xcodebuild -workspace apps/mobile/ios/MeniereJournal.xcworkspace -scheme MeniereJournal -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath artifacts/ios CODE_SIGNING_ALLOWED=NO build
